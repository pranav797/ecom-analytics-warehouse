version: 2

models:
  - name: fct_orders
    description: One row per order, all statuses. Use is_delivered = true for revenue and delivery metrics.
    data_tests:
      - expression_is_true:
          arguments:
            expression: "delivered_at >= purchased_at or delivered_at is null"
      - expression_is_true:
          arguments:
            expression: "is_delivered = (days_vs_estimate is not null)"
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        description: The person. Use this (not customer_id) for repeat-purchase metrics.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_unique_id
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: [delivered, shipped, canceled, unavailable, invoiced, processing, created, approved]
      - name: items_value
        description: Sum of item prices. GMV = sum of this over delivered orders (freight excluded).
        data_tests:
          - expression_is_true:
              arguments:
                expression: "items_value >= 0"
      - name: review_score
        description: Deduplicated review (see int_order_reviews_dedup). Null when the order has no review.
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
      - name: is_review_before_delivery
        description: Review written before the delivery date. Flag or drop these in the RD analysis.

  - name: fct_order_items
    description: One row per order item, with category and seller. Grain for seller / category revenue.
    data_tests:
      - unique:
          arguments:
            column_name: "order_id || '-' || order_item_id"
      - expression_is_true:
          arguments:
            expression: "price >= 0 and freight_value >= 0"
    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
      - name: seller_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id

  - name: dim_sellers
    description: One row per seller. lifetime_gmv = sum of item price on delivered orders, freight excluded.
    columns:
      - name: seller_id
        data_tests: [unique, not_null]
      - name: lifetime_gmv
        description: '{{ doc("metric_gmv") }}'

  - name: dim_customers
    description: >
      One row per person (customer_unique_id). Olist issues a new customer_id for every order, so
      grouping by customer_id would make every customer look like a one-time buyer.
    columns:
      - name: customer_unique_id
        data_tests: [unique, not_null]
      - name: orders
        data_tests:
          - expression_is_true:
              arguments:
                expression: "orders >= 1"
      - name: is_repeat_within_180d
        description: '{{ doc("metric_repeat_purchase") }}'

  - name: mart_seller_monthly
    description: >
      One row per seller x month (purchase month) with >= 1 delivered order, limited to complete
      months (vars metrics_start_month..metrics_end_month). Source for merchant KPIs on the dashboard.
    data_tests:
      - unique:
          arguments:
            column_name: "seller_id || '-' || month"
    columns:
      - name: gmv
        description: '{{ doc("metric_gmv") }}'
      - name: aov
        description: '{{ doc("metric_aov") }}'
      - name: on_time_rate
        description: '{{ doc("metric_on_time_rate") }}'
        data_tests:
          - expression_is_true:
              arguments:
                expression: "on_time_rate between 0 and 1"
      - name: avg_review_score
        description: '{{ doc("metric_avg_review") }}'
        data_tests:
          - expression_is_true:
              arguments:
                expression: "avg_review_score between 1 and 5 or avg_review_score is null"

  - name: mart_seller_cohorts
    description: '{{ doc("metric_seller_retention") }}'
    data_tests:
      - unique:
          arguments:
            column_name: "cohort_month || '-' || months_since_first_sale"
      - expression_is_true:
          arguments:
            expression: "retention_rate between 0 and 1"
      - expression_is_true:
          arguments:
            expression: "months_since_first_sale > 0 or retention_rate = 1"  # month 0 is 100% by definition

  - name: mart_delivery_reviews
    description: >
      One row per days_vs_estimate value (delivered orders with a review): review outcomes and
      covariate averages. Feeds the dashboard's RD plot. The RD estimate uses order-level data.
    columns:
      - name: days_vs_estimate
        data_tests: [unique, not_null]
      - name: share_review_before_delivery
        description: >
          Jumps from ~0.6% at 0 to 70% at +3 days: Olist appears to send the review survey around the
          promised date, so late customers often review before the package arrives.
